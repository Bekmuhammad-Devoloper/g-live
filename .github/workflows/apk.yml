name: Android ilovasi (APK)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Yig'ilgan APK serverga qo'yilsinmi (germaniya.live/app yangilanadi)"
        type: boolean
        default: true

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    name: Yig'ish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SSH_HOST: 34.41.154.237
      SSH_USER: deploy
      REMOTE_APK_DIR: /opt/gl-edu/apk

    steps:
      - uses: actions/checkout@v4

      - name: SSH kalitni tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.B_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Imzo kalitini olish
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST:$REMOTE_APK_DIR/android.keystore" \
            "$SSH_USER@$SSH_HOST:$REMOTE_APK_DIR/keystore.pass" \
            "$GITHUB_WORKSPACE/apk/"
          chmod 600 "$GITHUB_WORKSPACE/apk/android.keystore" "$GITHUB_WORKSPACE/apk/keystore.pass"
          echo "kalit olindi ($(wc -c < "$GITHUB_WORKSPACE/apk/android.keystore") bayt)"

      - name: APK yig'ish
        run: bash scripts/build-apk.sh
        env:
          APK_WORK: ${{ github.workspace }}/apk
          BW_HOME: ${{ github.workspace }}/.bubblewrap
          GL_ENV: /dev/null # barmoq izi tekshiruvi serverdagi .env ga tegmaydi

      - name: Natijani ko'rsatish
        run: |
          ls -la "$GITHUB_WORKSPACE/apk/germaniya-live.apk"
          echo "### APK tayyor" >> "$GITHUB_STEP_SUMMARY"
          echo "Hajm: $(du -h "$GITHUB_WORKSPACE/apk/germaniya-live.apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: APK ni artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: germaniya-live-apk
          path: ${{ github.workspace }}/apk/germaniya-live.apk
          retention-days: 90
          if-no-files-found: error

      - name: APK ni serverga qo'yish
        if: ${{ inputs.publish }}
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$GITHUB_WORKSPACE/apk/germaniya-live.apk" \
            "$SSH_USER@$SSH_HOST:$REMOTE_APK_DIR/germaniya-live.apk.new"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "mv $REMOTE_APK_DIR/germaniya-live.apk.new $REMOTE_APK_DIR/germaniya-live.apk && chmod 644 $REMOTE_APK_DIR/germaniya-live.apk && ls -la $REMOTE_APK_DIR/germaniya-live.apk"

      - name: Yuklab olish sahifasini tekshirish
        if: ${{ inputs.publish }}
        run: |
          CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 60 https://germaniya.live/api/app/android)
          echo "germaniya.live/api/app/android → HTTP $CODE"
          [ "$CODE" = "200" ]

      - name: Maxfiy fayllarni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key "$GITHUB_WORKSPACE/apk/android.keystore" "$GITHUB_WORKSPACE/apk/keystore.pass"
