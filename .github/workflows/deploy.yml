name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # qo'lda ham ishga tushirsa bo'ladi (Actions → Run workflow)

concurrency:
  group: deploy-b          # bir vaqtda faqat bitta deploy
  cancel-in-progress: false

jobs:
  check:
    name: Tekshiruv (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build sinovi
        run: npx next build
        env:
          DATABASE_URL: "file:./ci.db"

  deploy:
    name: B serverga deploy
    needs: check             # typecheck yiqilsa deploy bo'lmaydi
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitni tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.B_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.41.154.237 >> ~/.ssh/known_hosts 2>/dev/null

      - name: B'da yangilash skriptini ishga tushirish
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes deploy@34.41.154.237 \
            "bash /opt/gl-edu/deploy/gcp/update-b.sh"

      - name: Sayt tirikligini tekshirish
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 https://germaniya.live/login)
            echo "Urinish $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Kalitni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key
