# B serverni FAQAT O'QISH rejimida tekshirish + Finance V2 pre-cutover simulyatsiyasi (NUSXADA).
#
# 1) deploy/gcp/audit-readonly.sh — hech narsani o'zgartirmaydi (holat, sxema farqi, metadata).
# 2) deploy/gcp/finance-precutover.sh — prod bazaga YOZMAYDI: backup → nusxa → migratsiya →
#    backfill → smoke (alohida portlar) → rollback simulyatsiyasi. Prod servisga tegmaydi.
#    Skript /tmp ga scp qilinib bajariladi (stdin band bo'lmasin).
# Qo'lda: Actions → "Server audit (read-only)" → Run workflow   yoki
#   gh workflow run server-audit.yml --ref finance-v2 [-f precutover=true]
name: Server audit (read-only)

on:
  workflow_dispatch:
    inputs:
      precutover:
        description: "Finance V2 pre-cutover simulyatsiyasi (nusxada; prod DB o'zgarmaydi)"
        type: boolean
        default: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.B_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.179.202.164 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read-only audit
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes uzbekmen94@34.179.202.164 'bash -s' \
            < deploy/gcp/audit-readonly.sh
      - name: Finance V2 pre-cutover simulyatsiyasi (nusxada, prod DB o'zgarmaydi)
        if: ${{ inputs.precutover && hashFiles('deploy/gcp/finance-precutover.sh') != '' }}
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/gcp/finance-precutover.sh uzbekmen94@34.179.202.164:/tmp/gl-precutover-${{ github.sha }}.sh
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes uzbekmen94@34.179.202.164 \
            "FINANCE_REF=${{ github.ref_name }} bash /tmp/gl-precutover-${{ github.sha }}.sh < /dev/null; rc=\$?; rm -f /tmp/gl-precutover-${{ github.sha }}.sh; exit \$rc"
      - name: Kalitni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key
