<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Germaniya Live</title>
<!--
  Tarmoq uzilganda ko'rinadigan sahifa (capacitor.config.ts -> server.errorPath).

  Bu fayl telefonning ICHIDA turadi, shuning uchun internet bo'lmasa ham
  ochiladi. Shu sababli tashqaridan hech narsa yuklamaydi: shrift ham,
  rasm ham, uslub ham — hammasi shu yerda.
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #0b3c4d;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; padding: 32px 26px;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .ico {
    width: 92px; height: 92px; display: grid; place-items: center;
    border-radius: 30px; background: rgba(255,255,255,0.10);
  }
  h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  p  { margin: 8px 0 0; font-size: 14.5px; line-height: 1.55; color: rgba(255,255,255,0.72); max-width: 320px; }
  button {
    margin-top: 4px; border: 0; cursor: pointer;
    background: #fff; color: #0b3c4d;
    font: inherit; font-size: 15.5px; font-weight: 700;
    padding: 15px 34px; border-radius: 18px;
    transition: transform 120ms ease;
  }
  button:active { transform: scale(0.975); }
  button[disabled] { opacity: 0.6; }
  .hint { font-size: 12.5px; color: rgba(255,255,255,0.45); }
</style>
</head>
<body>
  <div class="ico" aria-hidden="true">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 8.5a16 16 0 0 1 19 0" />
      <path d="M5.5 12.2a11.5 11.5 0 0 1 13 0" />
      <path d="M8.7 15.9a6.7 6.7 0 0 1 6.6 0" />
      <circle cx="12" cy="19.6" r="1.2" fill="#fff" stroke="none" />
      <path d="m3 3 18 18" stroke-width="2" />
    </svg>
  </div>

  <div>
    <h1>Internet aloqasi yo&#8216;q</h1>
    <p>Ilova darslaringizni saytdan oladi. Wi-Fi yoki mobil internetni yoqib, qaytadan urinib ko&#8216;ring.</p>
  </div>

  <button id="retry" type="button">Qayta urinish</button>
  <div class="hint">germaniya.live</div>

<script>
  var HOME = "https://germaniya.live/student";
  var btn = document.getElementById("retry");

  function retry() {
    btn.disabled = true;
    btn.textContent = "Ulanmoqda…";
    // Qayta yuklash: sayt ko'tarilgan bo'lsa ilova o'z holiga qaytadi,
    // bo'lmasa Capacitor yana shu sahifani ko'rsatadi.
    location.replace(HOME);
  }

  btn.addEventListener("click", retry);

  // Internet o'zi qaytsa qo'l tegizmasdan davom etsin
  window.addEventListener("online", retry);
</script>
</body>
</html>
