; GL EDU Asteriski (asterisk-glive, /etc/asterisk-glive) — eski Asterisk bilan
; ko'prik. glive PROVAYDERGA O'ZI REGISTRATSIYA QILMAYDI (gl-registration
; bo'lmasin!) — 2022 ni eski Asterisk ushlab, shu yerga uzatadi; chiquvchi
; ham eski Asterisk (10.66.30.204:5060) orqali 2022 trunkidan chiqadi.
; QAYTARISH: rollback.sh
;═══════════════════════════════════════════════════════════════════════════

; Kiruvchi relay (eski Asterisk → glive): mavjud gl-from-trunk → route-lookup → Queue
[gl-relay-in]
type=endpoint
transport=transport-external
context=gl-from-trunk
disallow=all
allow=alaw,ulaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes

[gl-relay-identify]
type=identify
endpoint=gl-relay-in
match=10.66.30.204/32

; Chiquvchi relay (glive → eski Asterisk:5060 → gl2022 trunk → provayder)
[gl-oldast]
type=endpoint
transport=transport-external
context=gl-from-trunk
disallow=all
allow=alaw,ulaw
aors=gl-oldast-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
from_user=550552022

[gl-oldast-aor]
type=aor
contact=sip:10.66.30.204:5060
qualify_frequency=30
