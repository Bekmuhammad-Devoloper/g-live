;═══════════════════════════════════════════════════════════════════════════
; IKKI RAQAM BIR ASTERISKDA — dialplan (ESKI Asterisk, /etc/asterisk)
; 2277 yo'li o'zgarmaydi (from-trunk → eski CRM operatorlari).
; 2022: ikkala yo'l ham glive'ga (GL EDU) uzatadi.
; QAYTARISH: rollback.sh (include qatorini olib tashlab `dialplan reload`).
;═══════════════════════════════════════════════════════════════════════════

; 1) Asosiy yo'l — line= orqali gl2022 endpointiga bog'langan kiruvchi
[from-trunk-2022]
exten => _X.,1,NoOp(GL-EDU 2022 kiruvchi [line]: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(__GL_DID=550552022)
 same => n,Dial(PJSIP/2022@gl-newast,90,tTkK)
 same => n,Hangup()
exten => s,1,Goto(from-trunk-2022,550552022,1)

; 2) Zaxira yo'l — provayder line'siz yuborsa, IP bo'yicha from-trunk'ga tushadi;
;    Request-URI'dagi DID (550552022) aniq mos keladi va `_X.` dan USTUN turadi,
;    shuning uchun 2277 va boshqa raqamlar o'z yo'lida qoladi.
[from-trunk]
exten => 550552022,1,NoOp(GL-EDU 2022 kiruvchi [DID]: ${CALLERID(num)})
 same => n,Set(__GL_DID=550552022)
 same => n,Dial(PJSIP/2022@gl-newast,90,tTkK)
 same => n,Hangup()

; 3) GL EDU (glive) dan chiquvchi — 2022 trunki orqali, CallerID 2022
[from-glive]
exten => _998XXXXXXXXX,1,NoOp(GL-EDU chiquvchi 2022 orqali: ${EXTEN})
 same => n,Set(CALLERID(num)=550552022)
 same => n,Set(CALLERID(name)=550552022)
 same => n,Dial(PJSIP/${EXTEN}@gl2022,60,tTkK)
 same => n,Hangup()
exten => _0XXXXXXXXX,1,Goto(from-glive,998${EXTEN:1},1)
exten => _8XXXXXXXXX,1,Goto(from-glive,998${EXTEN:1},1)
exten => _XXXXXXXXX,1,Goto(from-glive,998${EXTEN},1)
; glive ichki raqamlari (glive1..10) bu yerga tushmasin — faqat tashqi raqamlar
exten => _[a-z].,1,Hangup(21)
