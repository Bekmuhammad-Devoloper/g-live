;═══════════════════════════════════════════════════════════════════════════
; IKKI RAQAM BIR ASTERISKDA — 550552022 trunki (ESKI Asterisk, /etc/asterisk)
; Uztelecom (2026-09-22): "bir IP'dan bir nechta raqam mumkin; har raqam uchun
; ALOHIDA, autentifikatsiyali trunk ko'tariladi". Shu sabab 2022 uchun alohida
; auth + registration + endpoint. 2277 (mavjud 'uztelecom') TEGILMAYDI.
;
; ADASHMASLIK (alashmaslik) kafolati — ikki qavat:
;   1) line=yes + endpoint=gl2022: registratsiya Contact'iga unikal ;line=
;      parametri qo'shiladi; provayder 2022 uchun kelgan INVITE'ni shu Contact'ga
;      yuboradi → Asterisk uni TO'G'RIDAN-TO'G'RI gl2022 endpointiga bog'laydi
;      (IP identify'dan oldin). Natija: from-trunk-2022 konteksti.
;   2) Zaxira yo'l: agar provayder line'ni qaytarmasa, INVITE IP bo'yicha mavjud
;      'uztelecom' endpointiga (from-trunk) tushadi — u yerda
;      old-extensions-2022.conf dagi `exten => 550552022` (Request-URI'dagi DID)
;      uni ushlab, xuddi shu joyga yo'naltiradi. Ikkala yo'l ham bitta manzil.
;
; QAYTARISH: rollback.sh (include qatorini olib tashlab `pjsip reload`).
;═══════════════════════════════════════════════════════════════════════════

[gl2022-auth]
type=auth
auth_type=userpass
username=550552022
password=550552022

[gl2022-registration]
type=registration
transport=transport-external
outbound_auth=gl2022-auth
server_uri=sip:10.77.37.4
client_uri=sip:550552022@10.77.37.4
contact_user=550552022
; Kiruvchi INVITE'ni shu endpointga bog'lash (Contact ;line= parametri)
line=yes
endpoint=gl2022
retry_interval=60
forbidden_retry_interval=300
max_retries=10000
expiration=3600

[gl2022-aor]
type=aor
contact=sip:550552022@10.77.37.4
qualify_frequency=0

[gl2022]
type=endpoint
transport=transport-external
context=from-trunk-2022
disallow=all
allow=alaw,ulaw
aors=gl2022-aor
outbound_auth=gl2022-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
trust_id_inbound=yes
send_rpid=yes
send_pai=yes
; Chiquvchida provayderga AYNAN 2022 ko'rinsin
from_user=550552022
callerid=550552022 <550552022>

;─── GL EDU Asteriski (asterisk-glive, 10.66.30.204:5062) bilan ko'prik ───────
; 2022 kiruvchi shu yerdan glive'ga uzatiladi; glive'dan kelgan chiquvchi esa
; from-glive kontekstida 2022 trunki orqali provayderga chiqadi.
[gl-newast]
type=endpoint
transport=transport-external
context=from-glive
disallow=all
allow=alaw,ulaw
aors=gl-newast-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes

[gl-newast-aor]
type=aor
contact=sip:10.66.30.204:5062
qualify_frequency=30

; glive (o'zimizning IP, 5062-port) dan kelgan so'rovlar — gl-newast endpointi.
; Provayder 10.77.37.4 — bunga tegmaydi.
[gl-newast-identify]
type=identify
endpoint=gl-newast
match=10.66.30.204/32
