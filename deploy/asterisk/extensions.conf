; /etc/asterisk/extensions.conf — dialplan
; CURL sticky-routing GL-EDU backendiga: /api/telephony/route-lookup
[general]
static=yes
writeprotect=no
clearglobalvars=yes

[globals]
TRUNK=uztelecom
TRUNK_NUM={{SIP_TRUNK_USERNAME}}
RECORD_DIR=/var/spool/asterisk/recording
CRM_URL=http://127.0.0.1:3000    ; GL-EDU (Next.js) — prod: nginx orqasidagi port

; ============ CHIQUVCHI (operator → mijoz), AMI Originate orqali ============
[from-internal]
exten => _998XXXXXXXXX,1,NoOp(Outbound: ${EXTEN})
 same => n,Set(CALLERID(num)=${TRUNK_NUM})
 same => n,Set(RECORD_FILE=${RECORD_DIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN})
 same => n,MixMonitor(${RECORD_FILE}.wav,b)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60,tTkK)
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => _0XXXXXXXXX,1,Set(FULL_NUM=998${EXTEN:1})
 same => n,Goto(from-internal,${FULL_NUM},1)
exten => _8XXXXXXXXX,1,Set(FULL_NUM=998${EXTEN:1})
 same => n,Goto(from-internal,${FULL_NUM},1)
exten => _XXXXXXXXX,1,Set(FULL_NUM=998${EXTEN})
 same => n,Goto(from-internal,${FULL_NUM},1)

; Ichki (operator ↔ operator)
exten => _[a-z]XXXXXX.,1,NoOp(Internal: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; ============ KIRUVCHI (mijoz → trunk raqami) ============
[from-trunk]
exten => _X.,1,NoOp(Inbound: ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(RETRY_COUNT=0)
 same => n,Set(ASSIGNED_OP=${CURL(${CRM_URL}/api/telephony/route-lookup?phone=${CALLERID(num)})})
 same => n,GotoIf($["${ASSIGNED_OP}" = ""]?queue)
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${ASSIGNED_OP})}" != "NOT_INUSE"]?queue)
 same => n,Set(RECORD_FILE=${RECORD_DIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${ASSIGNED_OP})
 same => n,MixMonitor(${RECORD_FILE}.wav,b)
 same => n,Dial(PJSIP/${ASSIGNED_OP},20,tTkK)
 same => n,StopMixMonitor()
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(queue),Set(RECORD_FILE=${RECORD_DIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-incoming-${CALLERID(num)}-queue)
 same => n,MixMonitor(${RECORD_FILE}.wav,b)
 same => n,Queue(operators,tTkKr,,,120)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(done),Hangup()

exten => s,1,Goto(from-trunk,_X.,1)

[default]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Hangup()
