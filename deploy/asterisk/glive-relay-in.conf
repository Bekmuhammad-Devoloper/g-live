[gl-relay-in]
type=endpoint
transport=transport-external
context=gl-from-trunk
disallow=all
allow=alaw,ulaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes

[gl-relay-identify]
type=identify
endpoint=gl-relay-in
match=10.66.30.204
