; /etc/asterisk/manager.conf — AMI (backend AMI worker ↔ Asterisk)
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1        ; backend AMI worker shu serverda bo'lsa loopback

[glive_ami]                  ; = ASTERISK_AMI_USER
secret = {{ami_secret_here}} ; = ASTERISK_AMI_PASS (kuchli tasodifiy)
permit = 127.0.0.1/255.255.255.255
read = all
write = all
