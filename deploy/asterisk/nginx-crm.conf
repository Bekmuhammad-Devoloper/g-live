# nginx — WSS (brauzer softphone) + GL-EDU (Next.js) reverse proxy
server {
    listen 443 ssl http2;
    server_name {{PUBLIC_DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{PUBLIC_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{PUBLIC_DOMAIN}}/privkey.pem;

    # WSS → Asterisk WSS (8089) — softphone SIP-over-WebSocket
    location /ws {
        proxy_pass https://127.0.0.1:8089/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # GL-EDU (Next.js) — hamma qolgan so'rovlar
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
