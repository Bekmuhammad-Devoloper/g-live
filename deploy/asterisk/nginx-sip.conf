# GL-EDU telefoniya WSS — sip.germaniya.live
#
# Softphone (brauzer) shu manzilga ulanadi va nginx uni Asterisk-glive'ning
# oddiy WebSocket portiga (127.0.0.1:8090) uzatadi. Shu tufayli haqiqiy
# Let's Encrypt sertifikati ishlaydi va brauzer ogohlantirmaydi.
#
# MUHIM: bu ALOHIDA fayl. Eski loyihaning /etc/nginx/sites-*/crm
# konfiguratsiyasiga umuman tegilmaydi.

server {
    listen 80;
    server_name sip.germaniya.live;

    # Let's Encrypt tekshiruvi va HTTPS'ga o'tkazish
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name sip.germaniya.live;

    # Sertifikat qatorlarini certbot o'zi qo'shadi

    location /ws {
        proxy_pass http://127.0.0.1:8090/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket uzoq turadi — timeout katta bo'lishi kerak
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
