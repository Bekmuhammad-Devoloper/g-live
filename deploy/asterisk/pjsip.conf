; /etc/asterisk/pjsip.conf — transportlar + SIP trunk + operator endpointlar
; {{...}} qiymatlarni loyihangizga moslang (deploy/asterisk/README.md ga qarang).

; ========== TRANSPORT: tashqi SIP UDP (provayderga) ==========
[transport-external]
type=transport
protocol=udp
bind=0.0.0.0
external_media_address={{PUBLIC_HOST}}
external_signaling_address={{PUBLIC_HOST}}

; ========== TRANSPORT: WebSocket (brauzer) ==========
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
local_net={{LOCAL_NET}}
external_media_address={{PUBLIC_HOST}}
external_signaling_address={{PUBLIC_HOST}}

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
local_net={{LOCAL_NET}}
external_media_address={{PUBLIC_HOST}}
external_signaling_address={{PUBLIC_HOST}}

; ========== SIP TRUNK (Uztelecom/Beeline/...) ==========
[uztelecom-auth]
type=auth
auth_type=userpass
username={{SIP_TRUNK_USERNAME}}
password={{SIP_TRUNK_PASSWORD}}

[uztelecom-registration]
type=registration
transport=transport-external
outbound_auth=uztelecom-auth
server_uri=sip:{{SIP_TRUNK_SERVER_IP}}
client_uri=sip:{{SIP_TRUNK_USERNAME}}@{{SIP_TRUNK_SERVER_IP}}
retry_interval=60
max_retries=100
expiration=3600

[uztelecom-aor]
type=aor
contact=sip:{{SIP_TRUNK_SERVER_IP}}:{{SIP_TRUNK_SERVER_PORT}}
qualify_frequency=30

[uztelecom-identify]
type=identify
endpoint=uztelecom
match={{SIP_TRUNK_SERVER_IP}}/32

[uztelecom]
type=endpoint
transport=transport-external
context=from-trunk
disallow=all
allow=alaw,ulaw
aors=uztelecom-aor
outbound_auth=uztelecom-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
trust_id_inbound=yes
send_rpid=yes
send_pai=yes
from_domain={{PUBLIC_HOST}}
from_user={{SIP_TRUNK_USERNAME}}

; ========== OPERATOR ENDPOINT (namuna: operator1) ==========
; operator2 ... operator10 uchun shu blokni nusxalang:
;   [operatorN] / [operatorN-auth] da N ni almashtiring,
;   password = SIP_OPERATOR{N}_PASS,
;   User jadvalidagi sipExtension = "operatorN".
[operator1]
type=aor
max_contacts=5
remove_existing=no
qualify_frequency=30

[operator1-auth]
type=auth
auth_type=userpass
username=operator1
password={{SIP_OPERATOR1_PASS}}

[operator1]
type=endpoint
transport=transport-ws
context=from-internal
disallow=all
allow=ulaw,alaw,opus
auth=operator1-auth
aors=operator1
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
device_state_busy_at=1
webrtc=yes
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
callerid="operator1" <operator1>
