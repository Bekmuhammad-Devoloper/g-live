; /etc/asterisk/queues.conf — operatorlar navbati (round-robin)
[operators]
strategy=rrmemory        ; xotirali round-robin
timeout=25               ; har operatorni 25s jiringlatadi
retry=1
wrapuptime=5
ringinuse=no             ; band operatorlarni o'tkazib yuboradi
announce-frequency=0
joinempty=strict
leavewhenempty=strict
maxlen=10                ; navbatda maks. 10 qo'ng'iroq
; a'zolar backend/worker tomonidan operator online bo'lganda qo'shiladi
; (yoki statik: member => PJSIP/operator1 ...)
