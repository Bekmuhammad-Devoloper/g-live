;═══════════════════════════════════════════════════════════════════════════
; asterisk-glive (/etc/asterisk-glive) — eski Asterisk bilan ko'prik.
; glive provayderga O'ZI REGISTRATSIYA QILMAYDI (gl-registration bo'lmasin).
; Kiruvchi: gl-relay-in (mavjud) → gl-from-trunk → route-lookup → Queue.
; Chiquvchi: TRUNK=gl-oldast → eski Asterisk:5060 → from-glive → 2277 trunki.
; QAYTARISH: rollback.sh
;═══════════════════════════════════════════════════════════════════════════

[gl-oldast]
type=endpoint
transport=transport-external
context=gl-from-trunk
disallow=all
allow=alaw,ulaw
aors=gl-oldast-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes

[gl-oldast-aor]
type=aor
contact=sip:10.66.30.204:5060
qualify_frequency=30
