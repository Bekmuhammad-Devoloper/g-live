;═══════════════════════════════════════════════════════════════════════════
; AQLLI TAQSIMOT — bitta trunk (2277), ikki tizim TENG (eski CRM + GL EDU)
; ESKI Asterisk (/etc/asterisk). 'uztelecom' endpoint konteksti from-trunk →
; from-trunk-smart ga o'tkaziladi (apply.sh). Qaror:
;   1) raqam FAQAT GL EDU'da bor (lid/o'quvchi)      → GL EDU (glive)
;   2) raqam FAQAT eski CRM'da bor (operator biriktirilgan) → eski CRM (from-trunk, o'zgarmagan)
;   3) ikkalasida ham / hech birida yo'q → terilgan raqam (DID) hal qiladi:
;        550552022 → GL EDU,  550552277 (va boshqa) → eski CRM
; CURL javob bermasa (tunnel/servis o'chiq) → bo'sh → "yo'q" deb hisoblanadi → DID qoidasi.
; Eski CRM lookup: NestJS global prefix api/v1 → /api/v1/asterisk/route-lookup (200, "operatorN" | bo'sh).
; QAYTARISH: rollback.sh
;═══════════════════════════════════════════════════════════════════════════

[from-trunk-smart]
exten => _X.,1,NoOp(SMART kiruvchi: ${CALLERID(num)} -> DID ${EXTEN} | To: ${PJSIP_HEADER(read,To)})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(dnstimeout)=2)
 same => n,Set(GL_KNOWN=${CURL(http://127.0.0.1:3010/api/telephony/known?phone=${CALLERID(num)})})
 same => n,Set(OLD_OP=${CURL(http://127.0.0.1:3000/api/v1/asterisk/route-lookup?phone=${CALLERID(num)})})
 ; Faqat TOZA javoblar hisobga olinadi: GL_KNOWN aynan "1"; OLD_OP aynan "operatorN"
 ; (404 HTML/JSON, xato matni va h.k. — "yo'q" deb hisoblanadi)
 same => n,Set(GL_KNOWN=${IF($["${GL_KNOWN}" = "1"]?1:0)})
 same => n,Set(OLD_OP=${IF($[${REGEX("^operator[0-9]+$" ${OLD_OP})}]?${OLD_OP}:)})
 same => n,NoOp(SMART: GL_KNOWN=[${GL_KNOWN}] OLD_OP=[${OLD_OP}])
 same => n,GotoIf($["${GL_KNOWN}" = "1" & "${OLD_OP}" = ""]?gledu)
 same => n,GotoIf($["${GL_KNOWN}" != "1" & "${OLD_OP}" != ""]?oldcrm)
 ; DID har xil formatda kelishi mumkin: 550552022 / 998550552022 / +998550552022, yoki
 ; Request-URI'da akkaunt (2277) turib, terilgan raqam To sarlavhasida bo'lishi mumkin
 same => n,Set(DID_TO=${PJSIP_HEADER(read,To)})
 same => n,GotoIf($["${EXTEN:-9}" = "550552022" | ${REGEX("550552022" ${DID_TO})}]?gledu:oldcrm)
 same => n(gledu),NoOp(SMART -> GL EDU)
 same => n,Set(__GL_DID=${EXTEN})
 same => n,Dial(PJSIP/2022@gl-newast,90,tTkK)
 same => n,Hangup()
 same => n(oldcrm),NoOp(SMART -> eski CRM)
 same => n,Goto(from-trunk,${EXTEN},1)

; Provayder Request-URI'siz (s) yuborsa — 2277 deb hisoblaymiz
exten => s,1,Goto(from-trunk-smart,550552277,1)

; GL EDU (glive) dan chiquvchi — AVVAL 2022 trunki (registratsiyasiz, faqat auth; mijozda 2022),
; provayder rad etsa (CHANUNAVAIL/CONGESTION) — 2277 trunkiga o'tadi (mijozda 2277)
[from-glive]
exten => _998XXXXXXXXX,1,NoOp(GL-EDU chiquvchi: ${EXTEN} — avval 2022)
 same => n,Set(CALLERID(num)=550552022)
 same => n,Set(CALLERID(name)=550552022)
 same => n,Dial(PJSIP/${EXTEN}@gl2022,60,tTkK)
 same => n,NoOp(2022 natija: ${DIALSTATUS} / ${HANGUPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?via2277)
 same => n,Hangup()
 same => n(via2277),NoOp(GL-EDU chiquvchi: 2022 o'tmadi → 2277 trunki)
 same => n,Set(CALLERID(num)=550552277)
 same => n,Set(CALLERID(name)=550552277)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60,tTkK)
 same => n,Hangup()
exten => _0XXXXXXXXX,1,Goto(from-glive,998${EXTEN:1},1)
exten => _8XXXXXXXXX,1,Goto(from-glive,998${EXTEN:1},1)
exten => _XXXXXXXXX,1,Goto(from-glive,998${EXTEN},1)
exten => _[a-z].,1,Hangup(21)
