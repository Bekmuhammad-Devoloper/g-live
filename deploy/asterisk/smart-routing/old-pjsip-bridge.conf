; ESKI Asterisk ↔ asterisk-glive (GL EDU) KO'PRIGI — provayderga QO'SHIMCHA
; registratsiya YO'Q (bitta trunk 2277). Kiruvchi: from-trunk-smart → gl-newast
; → glive gl-from-trunk. Chiquvchi: glive → (gl-newast identify) → from-glive → 2277.
; QAYTARISH: rollback.sh
;═══════════════════════════════════════════════════════════════════════════

[gl-newast]
type=endpoint
transport=transport-external
context=from-glive
disallow=all
allow=alaw,ulaw
aors=gl-newast-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes

[gl-newast-aor]
type=aor
contact=sip:10.66.30.204:5062
qualify_frequency=30

; glive (o'zimizning IP, 5062) dan kelgan so'rovlar — gl-newast. Provayder 10.77.37.4 — alohida.
[gl-newast-identify]
type=identify
endpoint=gl-newast
match=10.66.30.204/32
