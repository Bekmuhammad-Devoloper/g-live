; /etc/turnserver.conf — coturn (WebRTC NAT traversal)
listening-port=3478
tls-listening-port=5349
listening-ip={{PUBLIC_HOST}}
external-ip={{PUBLIC_HOST}}
min-port=49152
max-port=65535
realm={{PUBLIC_DOMAIN}}
server-name={{PUBLIC_DOMAIN}}
fingerprint
lt-cred-mech
user={{TURN_USERNAME}}:{{TURN_CREDENTIAL}}
no-cli
no-tlsv1
no-tlsv1_1
cert=/etc/letsencrypt/live/{{PUBLIC_DOMAIN}}/cert.pem
pkey=/etc/letsencrypt/live/{{PUBLIC_DOMAIN}}/privkey.pem
; /etc/default/coturn: TURNSERVER_ENABLED=1
