# Dev panel: __HOST__ → 127.0.0.1:__PORT__ (faqat /dev va Next statik fayllari)
server {
    listen 80;
    server_name __HOST__;

    client_max_body_size 4m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;

    location = / { return 302 /dev; }
    location ^~ /dev { proxy_pass http://127.0.0.1:__PORT__; }
    location ^~ /_next/ { proxy_pass http://127.0.0.1:__PORT__; }
    location ^~ /fonts/ { proxy_pass http://127.0.0.1:__PORT__; }
    location / { return 404; }
}
