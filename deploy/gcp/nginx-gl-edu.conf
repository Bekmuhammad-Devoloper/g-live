map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name germaniya.live www.germaniya.live;

    client_max_body_size 8m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 120s;

    location = /api/upload/session {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /api/upload {
        client_max_body_size 5g;       # ilovadagi MAX_UPLOAD_MB bilan bir xil
        client_body_timeout 120s;      # bo'lak 2–16 MB; sekin tarmoqda ham shunda keladi
        proxy_request_buffering off;   # oqim: tana kelgani sari Node'ga, nginx diskka yig'maydi
        proxy_read_timeout 600s;       # yakunlash (rename) va oqim rejimi uchun
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/uploads/\. {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/germaniya.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/germaniya.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.germaniya.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = germaniya.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name germaniya.live www.germaniya.live;
    return 404; # managed by Certbot
}
