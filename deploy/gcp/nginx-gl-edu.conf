# B serverdagi nginx sozlamasi — /etc/nginx/sites-available/gl-edu nusxasi.
# Bu yerda saqlanadi, chunki server qaytadan quriladigan bo'lsa
# chegaralar yo'qolib qolmasligi kerak: /api/upload* uchun 5g
# (src/lib/upload.ts, MAX_UPLOAD_MB) bilan bir xil bo'lishi shart.
# O'zgartirgandan keyin: sudo nginx -t && sudo systemctl reload nginx
#
# 2026-09-12: katta tana FAQAT yuklash yo'llarida. Ilgari 5g butun server
# uchun edi — istalgan kirgan foydalanuvchi JSON endpointga 3 GB yuborib
# Node'ni xotiradan yiqita olardi. Bo'lakli yuklash (/api/upload/session/<id>)
# 2–16 MB so'rovlar bilan ishlaydi, shuning uchun tana taymauti ham qisqa.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name germaniya.live www.germaniya.live;

    # Odatiy so'rovlar (server action, JSON, multipart rasm). Yuklash yo'llari pastda.
    client_max_body_size 8m;

    # Proksi sarlavhalari — server darajasida, location'larga meros bo'ladi
    # (location ichida proxy_set_header yozilsa meros UZILADI — yozmang)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 120s;

    # Bo'lakli yuklash seansini ochish — kichik JSON, katta tana kerak emas
    location = /api/upload/session {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
    }

    # Bo'laklar (PUT /api/upload/session/<id>?i=N) va eski bir so'rovli yuklash
    location ^~ /api/upload {
        client_max_body_size 5g;       # ilovadagi MAX_UPLOAD_MB bilan bir xil
        client_body_timeout 120s;      # bo'lak 2–16 MB; sekin tarmoqda ham shunda keladi
        proxy_request_buffering off;   # oqim: tana kelgani sari Node'ga, nginx diskka yig'maydi
        proxy_read_timeout 600s;       # yakunlash (rename) va oqim rejimi uchun
        proxy_pass http://127.0.0.1:3000;
    }

    # Yuklangan fayllar nuqtali papkadan hech qachon berilmaydi
    location ~ ^/uploads/\. {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/germaniya.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/germaniya.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.germaniya.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = germaniya.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name germaniya.live www.germaniya.live;
    return 404; # managed by Certbot
}
