# B serverdagi nginx sozlamasi — /etc/nginx/sites-available/gl-edu nusxasi.
# Bu yerda saqlanadi, chunki server qaytadan quriladigan bo'lsa
# client_max_body_size qiymati yo'qolib qolmasligi kerak: u /api/upload
# chegarasi (src/lib/upload.ts, MAX_UPLOAD_MB) bilan bir xil bo'lishi shart.
# O'zgartirgandan keyin: sudo nginx -t && sudo systemctl reload nginx

server {
    server_name germaniya.live www.germaniya.live;
    client_max_body_size 300m;   # ilovadagi chegara bilan bir xil (/api/upload)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;   # sekin internetda katta video uzilib qolmasin
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/germaniya.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/germaniya.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.germaniya.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = germaniya.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name germaniya.live www.germaniya.live;
    return 404; # managed by Certbot




}